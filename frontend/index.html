<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    
</head>
<body>
    <div class="container">
        <div class="deco-line"></div>
        <h1>YouTube Downloader</h1>
        <div class="input-group">
            <input type="text" placeholder="https://youtube.com/watch?v=..." id="urlInput">
            <button onclick="loadVideoInfo()">Start</button>
        </div>
        <p class="info-text">Füge einfach die YouTube-URL ein und klicke auf Start</p>
    </div>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-icon" id="modalIcon">!</div>
            <h3 class="modal-title" id="modalTitle">Titel</h3>
            <p class="modal-message" id="modalMessage">Nachricht</p>
            <button class="modal-button" onclick="closeModal()">OK</button>
        </div>
    </div>

    
</body>
</html>
